name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests -q

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: plugin.yaml parses and declares its surfaces
        run: |
          python - <<'PY'
          import pathlib, yaml
          data = yaml.safe_load(pathlib.Path("plugin.yaml").read_text())
          assert data["name"] == "offpeak", data
          assert data["version"], "version is required"
          assert data["provides_tools"], "declare the tools you register"
          print("manifest ok:", data["name"], data["version"])
          PY
